<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" type="text/css" href="style.css">
	<script src="p5.js"></script>
	<script src="p5.sound.min.js"></script>
</head>
<body>
	<div class="wrap">
		<div class="cols">
			<div class="ui rows left">
				<div>
					Canvas size:
					<div class="mono">
						<label>W <input id="width" type="number"></label><br>
						<label>H <input id="height" type="number"></label>
					</div>
				</div>
				<div>
					Controls:<br>
					<div class="mono">
						E: Camera Up<br>
						D: Camera Down<br>
						S: Camera Left<br>
						F: Camera Right<br>
						<br>
						W: Zoom Out<br>
						R: Zoom In<br>
						<br>
						G: Close Shape<br>
					</div>
				</div>
			</div>

			<div>
				<main></main>
				<div class="ui toolbar">
					<button id="reset-camera">Reset Camera</button>
					<button id="clear">Clear All</button>
				</div>
			</div>
			<div class="ui rows right">
				<div class="rows">
					<textarea id="shapes" onfocus="select()" class="mono"></textarea>
					<div>
						<label><input id="oneline" type="checkbox">One line</label>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script type="module" src="sketch.js"></script>
</body>
</html>
